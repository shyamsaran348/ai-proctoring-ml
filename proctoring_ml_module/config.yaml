model_dir: "proctoring_ml_module/models"
models:
  uc1:
    path: "proctoring_ml_module/models/uc1_resnet_embedder.pth"
    embedding_dim: 256
    backbone: "resnet50"
  uc2:
    path: "proctoring_ml_module/models/uc2_lstm.pth"
    sequence_length: 60
    input_dim: 1
    hidden_dim: 64
    num_layers: 2
  uc5:
    path: "proctoring_ml_module/models/uc5_risk_gru_v3.pth"
    input_dim: 6
    hidden_dim: 32
    max_history: 300
  gam:
    path: "proctoring_ml_module/models/gam_model.pth"
    input_dim: 6
    hidden_dim: 64
    num_layers: 2
  hgdm:
    path: "proctoring_ml_module/models/hgdm_model.pth"
    input_dim: 7
    hidden_dim: 64
    num_layers: 2

inference:
  device: "cpu" # Default to CPU for broad compatibility, change to "cuda" or "mps" if needed.
  enrollment_transform:
    resize: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
